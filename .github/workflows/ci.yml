name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --python ${{ matrix.python }} pytest -v
      - name: Install as a tool and run it
        run: |
          uv tool install --python ${{ matrix.python }} .
          mbot2 --help
          mbot2 upload --help
